name: Gh App Pipeline

run-name: "${{ github.event.client_payload.title || format('{0} #{1}', github.event.action, github.run_number) }}"

on:
  repository_dispatch:
    types: [trigger-gh-app]

jobs:
  process-stream:
    # Pinned: ubuntu-24.04 ships a stable apt ffmpeg (6.1.x) and avoids
    # surprises when ubuntu-latest moves to a newer image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      # Keep payload secrets out of the logs (the worker logs the payload).
      - name: Mask secrets
        shell: bash
        env:
          U_TOKEN: ${{ github.event.client_payload.U_TOKEN }}
          ENV_VAR_JSON_DB: ${{ github.event.client_payload.ENV_VAR_JSON_DB }}
        run: |
          if [ -n "$U_TOKEN" ]; then echo "::add-mask::$U_TOKEN"; fi
          if [ -n "$ENV_VAR_JSON_DB" ]; then echo "::add-mask::$ENV_VAR_JSON_DB"; fi

      # Base Infrastructure Cleanup & Space Logging
      - name: Nuke Bloatware (standard)
        if: ${{ github.event.client_payload.nuke }}
        run: |
          echo "============================================="
          echo "📊 INITIAL DISK SPACE"
          echo "============================================="
          df -h /

          echo ""
          echo "🧹 Commencing rapid cleanup..."
          echo "============================================="

          # Fast deletion of massive pre-installed runtimes
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          # FASTER DOCKER CLEANUP: Removes pre-cached images without blocking
          # instead of running the intensive full system prune --volumes
          sudo systemctl stop docker.service 2>/dev/null || true
          sudo rm -rf /var/lib/docker

          echo ""
          echo "============================================="
          echo "📊 POST-CLEANUP DISK SPACE"
          echo "============================================="
          df -h /

      # Aggressive GitHub Runner Disk Cleanup
      - name: Nuke Bloatware (aggressive)
        if: ${{ github.event.client_payload.nuke_aggr }}
        shell: bash
        run: |
          set +e

          echo "============================================="
          echo "📊 INITIAL DISK SPACE"
          echo "============================================="
          df -h /

          echo ""
          echo "🔍 ANALYZING LARGE DIRECTORIES"
          sudo du -xhd1 /usr /opt /var 2>/dev/null | sort -hr | head -30

          echo ""
          echo "🧹 REMOVING UNNECESSARY RUNTIMES"
          echo "============================================="

          # Android and Microsoft
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet

          # Haskell
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

          # GitHub preinstalled tool cache
          sudo rm -rf /opt/hostedtoolcache

          # Swift
          sudo rm -rf /usr/share/swift

          # Go
          sudo rm -rf /usr/local/go

          # Azure CLI and SDK
          sudo rm -rf /opt/az

          # Java and build tooling
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/share/gradle

          # Ruby and PHP
          sudo rm -rf /usr/lib/ruby
          sudo rm -rf /usr/share/rubygems-integration
          sudo rm -rf /usr/share/php
          sudo rm -rf /usr/lib/php

          # PowerShell
          sudo rm -rf /usr/local/share/powershell

          echo ""
          echo "🧹 CLEANING SYSTEM CACHES"
          echo "============================================="

          # APT package cache (the install step below runs apt-get update itself)
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*

          # Temporary files
          sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null
          sudo find /var/tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null

          # Documentation and manual pages
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/info/*

          # System crash dumps and logs
          sudo rm -rf /var/crash/*
          sudo journalctl --vacuum-size=10M 2>/dev/null

          echo ""
          echo "🐳 DESTROYING DOCKER CACHE"
          echo "============================================="

          sudo systemctl stop docker.socket 2>/dev/null
          sudo systemctl stop docker.service 2>/dev/null
          sudo systemctl stop containerd.service 2>/dev/null

          sudo rm -rf /var/lib/docker
          sudo rm -rf /var/lib/containerd

          echo ""
          echo "============================================="
          echo "📊 FINAL DISK SPACE"
          echo "============================================="
          df -h /

          echo ""
          echo "📊 REMAINING LARGE DIRECTORIES"
          sudo du -xhd1 /usr /opt /var 2>/dev/null | sort -hr | head -20

          echo ""
          echo "✅ CLEANUP COMPLETE"

      # Install Bun (must run before the parallel install step)
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # consider pinning to the version your logs print

      - name: Verify Bun
        shell: bash
        run: |
          set -e
          command -v bun
          bun --version

      # bun install runs unless task has "skip-deps". ffmpeg runs only if task
      # has "ffmpeg", the HF CLI only if task has "ff-dl". All start together; the step waits
      # for every job, prints each log, and fails the whole job if any failed.
      - name: Node Dependencies | Install FFmpeg | HF CLI (parallel)
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          TASK: ${{ toJson(github.event.client_payload.task) }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          pids=()
          names=()

          run_bg() {
            local name=$1
            shift
            "$@" >"$RUNNER_TEMP/$name.log" 2>&1 &
            pids+=($!)
            names+=("$name")
          }

          # task can be a string ("ffmpeg") or an array (["ffmpeg","ff-dl"])
          has_task() {
            jq -e --arg t "$1" '
              if type == "array" then any(.[]; . == $t)
              elif type == "string" then contains($t)
              else false end
            ' <<<"$TASK" >/dev/null
          }

          install_ffmpeg() {
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq --no-install-recommends ffmpeg &&
            ffmpeg -version | head -1
          }

          install_hf() {
            curl -LsSf https://hf.co/cli/install.sh | bash -s -- --exclude-skill &&
            hf --version
          }

          # Start everything in parallel
          if has_task skip-deps; then
            echo "⏭️  skipping bun install (task has 'skip-deps')"
          else
            run_bg deps bun install --frozen-lockfile
          fi
          if has_task ffmpeg; then run_bg ffmpeg install_ffmpeg; else echo "⏭️  skipping ffmpeg (task has no 'ffmpeg')"; fi
          if has_task ff-dl; then run_bg hf install_hf; else echo "⏭️  skipping HF CLI (task has no 'ff-dl')"; fi

          # Wait for all, show logs, fail the job if any install failed
          fail=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then s="ok"; else s="FAILED"; fail=1; fi
            echo "::group::${names[$i]} ($s)"
            cat "$RUNNER_TEMP/${names[$i]}.log"
            echo "::endgroup::"
            if [ "$s" = "FAILED" ]; then echo "::error::${names[$i]} install failed"; fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "❌ One or more installs failed, aborting."
            exit 1
          fi

          echo "✅ All installs finished."

      # Check disk metrics again right before launching runtime execution
      - name: Log Pre-Execution Disk Space
        run: |
          echo "============================================="
          echo "📊 PRE-EXECUTION DISK SPACE (After Installations)"
          echo "============================================="
          df -h /

      # Run target worker
      - name: Execute Targeted Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          IS_GH: "1"
          NODE_ENV: "production"
          UPSTASH_REDIS_REST_URL: ${{ github.event.client_payload.U_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ github.event.client_payload.U_TOKEN }}
          ENV_VAR_JSON_DB: ${{ github.event.client_payload.ENV_VAR_JSON_DB }}
          ID: ${{ github.event.client_payload.ID }}
          INPUT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          # Fallback to a default script if no specific worker is provided
          TARGET_WORKER: ${{ github.event.client_payload.worker || 'index.ts' }}
        run: |
          echo "============================================="
          echo "VALIDATION PHASE: Checking target script..."
          echo "Target Script: $TARGET_WORKER"
          echo "============================================="

          # Check if the requested file actually exists on the runner's disk
          if [ ! -f "$TARGET_WORKER" ]; then
            echo "❌ CRITICAL ERROR: The requested worker file '$TARGET_WORKER' does not exist."
            echo "Please check your API payload parameters for typos or verify the file is committed to Git."
            echo "Current Workspace Files:"
            find . -maxdepth 3 -name "*.ts" -not -path "*/node_modules/*"
            exit 1
          fi

          echo "✅ Validation successful! Launching execution environment..."
          bun run "$TARGET_WORKER"
