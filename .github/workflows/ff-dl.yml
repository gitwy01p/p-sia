name: Gh App Pipeline

on:
  repository_dispatch:
    types: [trigger-gh-app]

jobs:
  process-stream:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      # ==========================================
      # BASE INFRASTRUCTURE CLEANUP
      # ==========================================
      - name: Optimize & Nuke Bloatware
        if: ${{ github.event.client_payload.nuke }}
        shell: bash
        run: |
          echo "============================================="
          echo "📊 INITIAL DISK SPACE"
          echo "============================================="
          df -h /

          echo "🧹 Commencing rapid cleanup..."

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo systemctl stop docker.service 2>/dev/null || true
          sudo rm -rf /var/lib/docker

          echo "============================================="
          echo "📊 POST-CLEANUP DISK SPACE"
          echo "============================================="
          df -h /

      # ==========================================
      # AGGRESSIVE RUNNER CLEANUP
      # ==========================================
      - name: Optimize & Nuke Bloatware
        if: ${{ github.event.client_payload.nuke_aggr }}
        shell: bash
        run: |
          set +e

          echo "============================================="
          echo "📊 INITIAL DISK SPACE"
          echo "============================================="
          df -h /

          echo "🔍 ANALYZING LARGE DIRECTORIES"
          sudo du -xhd1 /usr /opt /var 2>/dev/null | sort -hr | head -30

          echo "🧹 REMOVING UNNECESSARY RUNTIMES"

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/go
          sudo rm -rf /opt/az
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/maven
          sudo rm -rf /usr/share/gradle
          sudo rm -rf /usr/lib/ruby
          sudo rm -rf /usr/share/rubygems-integration
          sudo rm -rf /usr/share/php
          sudo rm -rf /usr/lib/php
          sudo rm -rf /usr/local/share/powershell

          echo "🧹 CLEANING SYSTEM CACHES"

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*

          sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null
          sudo find /var/tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null

          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/info/*

          sudo rm -rf /var/crash/*
          sudo journalctl --vacuum-size=10M 2>/dev/null

          echo "🐳 DESTROYING DOCKER CACHE"

          sudo systemctl stop docker.socket 2>/dev/null
          sudo systemctl stop docker.service 2>/dev/null
          sudo systemctl stop containerd.service 2>/dev/null

          sudo rm -rf /var/lib/docker
          sudo rm -rf /var/lib/containerd

          echo "============================================="
          echo "📊 FINAL DISK SPACE"
          echo "============================================="
          df -h /

          echo "📊 REMAINING LARGE DIRECTORIES"
          sudo du -xhd1 /usr /opt /var 2>/dev/null | sort -hr | head -20

          echo "✅ CLEANUP COMPLETE"

      # ==========================================
      # INSTALL ASTRAL UV
      # ==========================================
      - name: Install Astral uv
        if: ${{ github.event.client_payload.task == 'ff-dl' }}
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Verify Astral uv
        if: ${{ github.event.client_payload.task == 'ff-dl' }}
        shell: bash
        run: |
          set -e
          command -v uv
          uv --version
          command -v uvx
          uvx --version

      # ==========================================
      # INSTALL NODE.JS
      # ==========================================
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Node.js
        shell: bash
        run: |
          set -e
          command -v node
          node --version
          npm --version

      # ==========================================
      # INSTALL BUN
      # ==========================================
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Verify Bun
        shell: bash
        run: |
          set -e
          command -v bun
          bun --version

      # ==========================================
      # INSTALL HUGGING FACE CLI
      # ==========================================
      - name: Install Hugging Face CLI
        if: ${{ github.event.client_payload.task == 'ff-dl' }}
        shell: bash
        run: |
          set -e
          curl -LsSf https://hf.co/cli/install.sh | bash -s -- --exclude-skill

      - name: Verify Hugging Face CLI
        if: ${{ github.event.client_payload.task == 'ff-dl' }}
        shell: bash
        run: |
          set -e
          command -v hf
          hf --version

      # ==========================================
      # DEPENDENCY CACHING
      # ==========================================
      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}

      # ==========================================
      # SMART DEPENDENCY VALIDATION
      # ==========================================
      - name: Smart Dependency Installation
        shell: bash
        run: |
          set -e

          echo "============================================="
          echo "DEPENDENCY VALIDATION"
          echo "============================================="

          if [ -f bun.lock ]; then
            LOCK_HASH=$(sha256sum bun.lock | awk '{print $1}')
          elif [ -f bun.lockb ]; then
            LOCK_HASH=$(sha256sum bun.lockb | awk '{print $1}')
          else
            echo "❌ No Bun lockfile found."
            exit 1
          fi

          if [ -d node_modules ] && \
             [ -f node_modules/.bun-lock-hash ] && \
             [ "$(cat node_modules/.bun-lock-hash)" = "$LOCK_HASH" ]; then

            echo "✅ node_modules exists."
            echo "✅ Lockfile fingerprint matches."
            echo "⏭️ Skipping bun install."

          else

            echo "📦 Cache missing or dependencies changed."
            echo "Installing dependencies..."

            bun install --frozen-lockfile

            echo "$LOCK_HASH" > node_modules/.bun-lock-hash

            echo "✅ Dependencies installed successfully."

          fi

      # ==========================================
      # PRE-EXECUTION DISK METRICS
      # ==========================================
      - name: Log Pre-Execution Disk Space
        shell: bash
        run: |
          echo "============================================="
          echo "📊 PRE-EXECUTION DISK SPACE"
          echo "============================================="
          df -h /

      # ==========================================
      # EXECUTE TARGET WORKER
      # ==========================================
      - name: Execute Targeted Worker
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          IS_GH: "1"

          UPSTASH_REDIS_REST_URL: ${{ github.event.client_payload.U_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ github.event.client_payload.U_TOKEN }}

          ENV_VAR_JSON_DB: ${{ github.event.client_payload.ENV_VAR_JSON_DB }}
          ID: ${{ github.event.client_payload.ID }}

          INPUT_PAYLOAD: ${{ toJson(github.event.client_payload) }}

          TARGET_WORKER: ${{ github.event.client_payload.worker || 'index.ts' }}

        shell: bash
        run: |
          echo "============================================="
          echo "VALIDATION PHASE"
          echo "Target Script: $TARGET_WORKER"
          echo "============================================="

          if [ ! -f "$TARGET_WORKER" ]; then
            echo "❌ CRITICAL ERROR: Worker does not exist."
            echo "Target: $TARGET_WORKER"

            echo "Current Workspace Files:"
            find . -maxdepth 3 -name "*.ts" -not -path "*/node_modules/*"

            exit 1
          fi

          echo "✅ Validation successful!"
          echo "🚀 Launching worker..."

          bun run "$TARGET_WORKER"
